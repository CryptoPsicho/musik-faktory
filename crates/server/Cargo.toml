[package]
name = "musik-faktory"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Musik Faktory server: ElevenLabs music proxy with parental spending limits"

[dependencies]
musik-shared = { path = "../shared" }
serde.workspace = true
serde_json.workspace = true
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "time", "signal", "sync", "process"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "set-header"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
argon2 = "0.5"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
rust-embed = { version = "8", features = ["mime-guess"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"

[workspace]
resolver = "2"
members = ["crates/shared", "crates/server", "crates/ui"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Smaller WASM for the UI (dx uses the `wasm-release` profile when present)
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = false        # wasm-bindgen needs its custom sections; dx runs wasm-opt afterwards
